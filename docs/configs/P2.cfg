hostname P2
!
vrf definition MGMT
 rd 65000:100
 !
 address-family ipv4
 exit-address-family
!
no ip domain lookup
ip domain name cisco.com
ip cef
!
username cisco privilege 15 secret 5 $1$0j3u$p/IpF2MZOBN3Ve1YHQ/yo0
!
interface Loopback100
 vrf forwarding MGMT
 ip address 10.255.0.2 255.255.255.255
 ip ospf 100 area 0
!
interface Ethernet0/0
 no ip address
!
interface Ethernet0/0.3999
 encapsulation dot1Q 3999
 vrf forwarding MGMT
 ip address 172.16.24.1 255.255.255.252
 ip ospf 100 area 0
!
interface Ethernet0/1
 no ip address
!
interface Ethernet0/1.3999
 encapsulation dot1Q 3999
 vrf forwarding MGMT
 ip address 172.16.12.2 255.255.255.252
 ip ospf 100 area 0
!
interface Ethernet0/2
 vrf forwarding MGMT
 ip address dhcp
 ip ospf 100 area 0
!
router ospf 100 vrf MGMT
 router-id 10.255.0.2
 passive-interface Ethernet0/2
!
ip ssh version 2
no ip http server
no ip http secure-server
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
